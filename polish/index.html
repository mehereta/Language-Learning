<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krok po kroku: daily Polish</title>
<meta name="description" content="Learn a little Polish every day: short lessons, reviews, and real-life conversations.">
<meta name="theme-color" content="#2348A6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Krok po kroku">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F8;--surface:#FFFFFF;--ink:#191D2B;--muted:#5C6276;--line:#DADDE7;
  --green:#2348A6;--green-soft:#DFE6F7;--gold:#D99A1B;--gold-soft:#FBEFD3;
  --red:#C62A3B;--red-soft:#F8DDE0;--on-green:#FFFFFF;
  --p1:#C62A3B;--p2:#E8862A;--p3:#F2C230;--p4:#2E8B57;--p5:#2348A6;--p6:#A3337D;--p7:#191D2B;
  --am:'Bricolage Grotesque','Lexend',system-ui,sans-serif;
  --ui:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11131C;--surface:#1A1D29;--ink:#E9EBF3;--muted:#9BA1B6;--line:#2C3142;
    --green:#7F9CF0;--green-soft:#1F2847;--gold:#F0BE4A;--gold-soft:#3A3020;
    --red:#F07A86;--red-soft:#40222A;--on-green:#0F1324;--p7:#E9EBF3;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11131C;--surface:#1A1D29;--ink:#E9EBF3;--muted:#9BA1B6;--line:#2C3142;
  --green:#7F9CF0;--green-soft:#1F2847;--gold:#F0BE4A;--gold-soft:#3A3020;
  --red:#F07A86;--red-soft:#40222A;--on-green:#0F1324;--p7:#E9EBF3;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-weight:400;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:88px}
body.in-session{padding-bottom:24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.am{font-family:var(--am)}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}

/* Band inspired by Łowicz striped folk fabric (pasiak) */
.tibeb{height:12px;background:repeating-linear-gradient(90deg,var(--p1) 0 10px,var(--p2) 10px 14px,var(--p3) 14px 20px,var(--p4) 20px 28px,var(--p7) 28px 30px,var(--p5) 30px 38px,var(--p6) 38px 42px,var(--p3) 42px 46px)}

header.top{padding:18px 0 6px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-weight:600;font-size:17px;letter-spacing:.01em}
.brand .am{font-weight:800;font-size:19px;letter-spacing:-.01em;color:var(--green)}
.streak-chip{font-size:14px;color:var(--muted)}
.home-link{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--muted);text-decoration:none;padding:6px 10px 6px 6px;margin-left:-6px;border-radius:8px}
.home-link:hover{color:var(--ink);background:var(--line)}
.top-left{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.streak-chip b{color:var(--ink);font-weight:600}

/* Today */
.hero{padding:28px 0 8px}
.hero .glyph{font-family:var(--am);font-weight:800;font-size:clamp(52px,15vw,92px);line-height:1;letter-spacing:-.02em;color:var(--ink);margin:0}
.hero .gloss{margin:6px 0 0;color:var(--muted);font-size:17px}
.hero .gloss b{color:var(--ink);font-weight:500}
.lesson{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.lesson h2{margin:0 0 4px;font-size:21px;font-weight:600}
.lesson p{margin:0;color:var(--muted)}
.counts{display:flex;gap:22px;margin:18px 0 20px}
.counts div{font-size:14px;color:var(--muted)}
.counts strong{display:block;font-size:30px;font-weight:500;color:var(--ink);line-height:1.1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 20px;font-weight:500;font-size:16px;cursor:pointer;min-height:50px}
.btn.primary{background:var(--green);color:var(--on-green);width:100%}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border:1px solid var(--line);width:100%}
.btn.ghost:hover{background:var(--green-soft)}
.btn+.btn{margin-top:10px}
.upnext{margin-top:22px;color:var(--muted);font-size:15px}
.upnext .am{color:var(--ink)}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:12px 4px 14px;font-size:13px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .am{font-size:15px;font-weight:600;line-height:1.3}
nav.tabs button[aria-current="page"]{color:var(--green);font-weight:500}

/* Session */
.sess-top{display:flex;align-items:center;gap:14px;padding:18px 0 4px}
.close{background:none;border:0;font-size:26px;line-height:1;padding:4px 8px;color:var(--muted);cursor:pointer}
.bar{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .3s ease}
.stage{padding:26px 0 0}
.kicker{color:var(--muted);font-size:14px;margin:0 0 14px}
.kicker .am{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:34px 22px 26px;text-align:center}
.card .big{font-family:var(--am);font-weight:700;font-size:clamp(34px,9.5vw,50px);letter-spacing:-.01em;line-height:1.25;margin:0;word-break:break-word}
.card .tr{margin:10px 0 0;font-size:19px;color:var(--green);font-weight:500}
.card .en{margin:18px 0 0;font-size:20px}
.reveal{margin-top:10px;background:none;border:1px dashed var(--line);border-radius:10px;padding:8px 14px;color:var(--muted);cursor:pointer;font-size:15px}
.note{margin:18px 0 0;padding:14px 16px;background:var(--gold-soft);border-radius:12px;text-align:left;font-size:15px;line-height:1.55}
.note .am{font-size:16px}
.play{margin-top:16px;background:var(--green-soft);color:var(--green);border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font-size:15px;font-weight:500}
.actions{margin-top:22px}
.prompt-q{font-size:15px;color:var(--muted);margin:0 0 6px}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;min-height:58px;font-size:17px}
.opt:hover:not([disabled]){border-color:var(--green)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.opt .am{font-weight:600;font-size:19px}
.opt small{display:block;color:var(--muted);font-size:14px}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.feedback{margin-top:18px;font-weight:500}
.feedback.ok{color:var(--green)}
.feedback.no{color:var(--red)}

.done{text-align:center;padding-top:40px}
.done .glyph{font-family:var(--am);font-weight:800;font-size:80px;letter-spacing:-.02em;line-height:1.1;margin:0}
.done .gloss{color:var(--muted);margin:4px 0 26px}
.done-stats{display:flex;justify-content:center;gap:30px;margin:0 0 30px}
.done-stats div{font-size:14px;color:var(--muted)}
.done-stats strong{display:block;font-size:30px;font-weight:500;color:var(--ink)}

/* Phrasebook */
h1.page{font-size:26px;font-weight:600;margin:22px 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.search{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
details.sounds{margin:14px 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.sounds summary{cursor:pointer;font-weight:500}
details.sounds dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
details.sounds dt{font-weight:600;color:var(--green)}
details.sounds dd{margin:0;color:var(--muted)}
.unit{margin-top:30px}
.unit-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.unit-h h3{margin:0;font-size:18px;font-weight:600}
.unit-h h3 .am{font-weight:600;margin-right:8px;color:var(--green)}
.unit-h span{font-size:14px;color:var(--muted);white-space:nowrap}
.row{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line)}
.row .dot.s1,.row .dot.s2,.row .dot.s3{background:var(--gold);border-color:var(--gold)}
.row .dot.s4,.row .dot.s5{background:var(--green);border-color:var(--green)}
.row .am{font-weight:600;font-size:19px;line-height:1.35}
.row .tr{color:var(--green);font-size:14px}
.row .en{color:var(--muted);font-size:15px}
.row .play{margin:0;padding:6px 12px;font-size:13px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1.5px solid var(--line)}
.empty{color:var(--muted);padding:24px 0}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat strong{display:block;font-size:28px;font-weight:500;line-height:1.15}
.stat span{font-size:13px;color:var(--muted)}
h2.sec{font-size:17px;font-weight:600;margin:30px 0 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{aspect-ratio:1;border-radius:7px;background:var(--line);opacity:.55}
.cal div.on{background:var(--green);opacity:1}
.cal div.today{outline:2px solid var(--gold);outline-offset:1px}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:12px;color:var(--muted);text-align:center;margin-bottom:6px}
.ubar{margin-bottom:14px}
.ubar .lbl{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px}
.ubar .lbl span{color:var(--muted);font-size:14px}
.ubar .bar{height:7px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:10px 6px;cursor:pointer;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green);font-weight:500}
.setting{margin-bottom:18px}
.setting label{display:block;font-size:15px;margin-bottom:8px}
.danger{background:none;border:1px solid var(--red);color:var(--red);border-radius:12px;padding:12px 16px;cursor:pointer;width:100%;margin-top:8px}
.danger.armed{background:var(--red);color:var(--surface)}
.sync{font-size:13px;color:var(--muted);margin-top:22px}

/* Conversations */
.talk-card{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.talk-card .kick{font-size:14px;color:var(--muted);margin:0}
.talk-card .kick .am{color:var(--green);font-weight:600;margin-right:6px}
.talk-card h2{margin:4px 0 4px;font-size:18px;font-weight:600}
.talk-card p.set{margin:0 0 16px;color:var(--muted)}
.scene{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;cursor:pointer;margin-top:12px}
.scene:hover:not([disabled]){border-color:var(--green)}
.scene[disabled]{opacity:.55;cursor:not-allowed}
.scene .place{font-size:14px;color:var(--muted)}
.scene .place .am{color:var(--green);font-weight:600;margin-right:6px}
.scene h3{margin:4px 0 6px;font-size:18px;font-weight:600}
.scene p{margin:0;color:var(--muted);font-size:15px}
.scene .meta{margin-top:10px;font-size:14px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.scene .meta b{color:var(--green);font-weight:500}
.addr{background:var(--gold-soft);border-radius:14px;padding:16px 18px;margin:6px 0 8px}
.addr p{margin:0 0 12px}
.chat{display:flex;flex-direction:column;gap:12px;padding-top:18px}
.scene-intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px}
.scene-intro .am{color:var(--green);font-weight:600;margin-right:6px}
.scene-intro b{font-weight:600}
.narr{font-size:14px;color:var(--muted);font-style:italic;text-align:center;margin:4px 12px}
.bub{max-width:88%;border-radius:18px;padding:12px 16px}
.bub.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:var(--green-soft);border-bottom-right-radius:6px;text-align:right}
.bub .who{font-size:13px;color:var(--muted);margin-bottom:2px}
.bub .am{font-weight:600;font-size:21px;line-height:1.4;display:block}
.bub .tr{color:var(--green);font-size:15px}
.bub .en{color:var(--muted);font-size:15px;margin-top:4px}
.bub .tools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.bub .tools:empty{display:none}
.mini{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.mini:hover{border-color:var(--green);color:var(--green)}
.your-turn{font-size:15px;color:var(--muted);margin:22px 0 0;font-weight:500}
.opt small+small{margin-top:2px}

/* Install tip and backup */
.tip{margin-top:20px;background:var(--gold-soft);border-radius:14px;padding:14px 16px;font-size:15px;display:flex;gap:12px;align-items:flex-start}
.tip p{margin:0;flex:1}
.tip .x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.backup-msg{font-size:14px;margin:10px 0 0;color:var(--green)}
.backup-msg.err{color:var(--red)}
details.code{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.code summary{cursor:pointer;font-weight:500}
details.code textarea{width:100%;min-height:90px;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="tibeb" aria-hidden="true"></div>
<main id="app" class="wrap"></main>
<nav class="tabs" id="tabs" aria-label="Sections">
  <div class="wrap">
    <button data-tab="today"><span class="am" aria-hidden="true">Dziś</span>Today</button>
    <button data-tab="talk"><span class="am" aria-hidden="true">Rozmowy</span>Talk</button>
    <button data-tab="phrases"><span class="am" aria-hidden="true">Słówka</span>Phrasebook</button>
    <button data-tab="progress"><span class="am" aria-hidden="true">Postępy</span>Progress</button>
  </div>
</nav>

<script>
/* ---------- Content: [id, Polish, pronunciation guide, English, note] ---------- */
const UNITS = [
 {id:'greet', am:'Powitania', title:'Greetings', items:[
  ['g1','Dzień dobry','jen DOB-ri','Hello / good morning','The everyday polite greeting, used from morning until evening with anyone you don’t know well.'],
  ['g2','Cześć','cheshch','Hi / bye (casual)','For friends and people your age. It also works as goodbye.'],

  ['g10','Dobranoc','do-BRA-nots','Good night','Only for late at night or bedtime.']
 ]},
 {id:'polite', am:'Grzeczność', title:'Being polite', items:[
  ['p1','Dziękuję','jen-KOO-yeh','Thank you','Casual: <span class="am">dzięki</span> (JEN-kee).'],
  ['p2','Proszę','PRO-sheh','Please / here you go / you’re welcome','One of the most useful words in Polish. It covers all three.'],

  ['p4','Tak','tak','Yes',''],
  ['p5','Nie','nyeh','No',''],

 ]},
 {id:'intro', am:'Poznajmy się', title:'Introducing yourself', items:[

  ['i2','Jak masz na imię?','yak mash na EE-myeh','What’s your name? (casual)','Formal: <span class="am">Jak się pan nazywa?</span> to a man, <span class="am">pani</span> to a woman.'],

  ['i4','Skąd jesteś?','skont YES-tesh','Where are you from? (casual)','Formal: <span class="am">Skąd pan jest?</span> or <span class="am">Skąd pani jest?</span>'],
  ['i5','Jestem z ...','YES-tem z …','I’m from …','<span class="am">Jestem z Ameryki</span> (YES-tem z a-MEH-ri-kee) means “I’m from America.” Country names change their ending after <span class="am">z</span>, but people will understand you either way.'],
  ['i6','Mówię trochę po polsku','MOO-vyeh TRO-heh po POL-skoo','I speak a little Polish','People will be delighted you’re trying.'],
  ['i7','Nie rozumiem','nyeh ro-ZOO-myem','I don’t understand',''],
  ['i8','Możesz powtórzyć?','MO-zhesh pof-TOO-zhich','Can you repeat that? (casual)','Formal: <span class="am">Może pan/pani powtórzyć?</span>'],
  ['i9','Możesz mówić wolniej?','MO-zhesh MOO-veech VOL-nyey','Can you speak more slowly? (casual)','Formal: <span class="am">Proszę mówić wolniej</span> (PRO-sheh MOO-veech VOL-nyey).'],

 ]},

/* ---------- State ---------- */
const KEY='krok-progress-v1';
function blank(){return{v:1,items:{},days:{},newPerDay:5,display:'both',newDate:'',newCount:0,convos:{},addressAs:'',updatedAt:0}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(blank(),JSON.parse(r))}catch(e){}return blank()}
let S=load();
let remoteRef=null,chain=Promise.resolve(),synced=false;
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function saveRemote(){
  if(!remoteRef)return;
  const body=JSON.parse(JSON.stringify(S));
  const r=remoteRef;
  chain=chain.then(()=>r.set(body)).then(()=>{if(!synced){synced=true;if(view==='progress'&&!sess&&!convo)render()}}).catch(e=>{if(e&&(e.code==='invalid_argument'||e.code==='revoked')){remoteRef=null;if(synced){synced=false;if(view==='progress'&&!sess&&!convo)render()}}});
}
function commit(){S.updatedAt=Date.now();saveLocal();saveRemote()}
async function connect(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    if(!user||!db)return;
    const uid=await user.id();
    if(!uid)return;
    const ref=db.doc('data/users/'+uid+'/progress');
    const snap=await ref.get();
    remoteRef=ref;
    if(snap.exists){
      synced=true;
      const r=snap.data()||{};
      if((r.updatedAt||0)>(S.updatedAt||0)){
        S=Object.assign(blank(),JSON.parse(JSON.stringify(r)));saveLocal();
        if(!sess&&!convo)render();
      }else if((S.updatedAt||0)>(r.updatedAt||0))saveRemote();
    }else if(S.updatedAt)saveRemote();
    if((view==='progress'||view==='talk')&&!sess&&!convo)render();
  }catch(e){remoteRef=null}
}

/* ---------- Dates & scheduling ---------- */
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return dstr(new Date())}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return dstr(d)}
function streak(){let n=0;const d=new Date();if(!S.days[dstr(d)])d.setDate(d.getDate()-1);while(S.days[dstr(d)]){n++;d.setDate(d.getDate()-1)}return n}
function newLeft(){return S.newDate===today()?Math.max(0,S.newPerDay-S.newCount):S.newPerDay}
function nextNew(){return ALL.filter(x=>!S.items[x.id]).slice(0,newLeft())}
function dueItems(){const t=today();return ALL.filter(x=>S.items[x.id]&&S.items[x.id].due<=t)}
function learnedCount(){return Object.keys(S.items).length}
function masteredCount(){return Object.values(S.items).filter(i=>i.box>=4).length}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- Voice (uses the device’s Polish voice) ---------- */
let voice=null;
function pickVoice(){try{voice=speechSynthesis.getVoices().find(v=>/^pl(-|_|$)/i.test(v.lang))||null}catch(e){voice=null}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=()=>{const had=!!voice;pickVoice();if(!!voice!==had)render()}}
function speak(t){if(!voice)return;try{const u=new SpeechSynthesisUtterance(t.replace(/\.\.\./g,' '));u.voice=voice;u.lang=voice.lang;u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function playBtn(id,cls='play'){return voice?`<button class="${cls}" data-act="speak" data-id="${id}">▶ Listen</button>`:''}

/* ---------- Session ---------- */
let sess=null;
let view=['today','talk','phrases','progress'].includes(location.hash.slice(1))?location.hash.slice(1):'today';

function startSession(extra){
  const fresh=extra?[]:nextNew();
  const review=extra?shuffle(ALL.filter(x=>S.items[x.id])).slice(0,8):shuffle(dueItems()).slice(0,20);
  if(!fresh.length&&!review.length)return;
  const first=[...fresh.map(x=>({item:x,dir:'am'})),...review.map(x=>({item:x,dir:Math.random()<.5?'am':'en'}))];
  const queue=[...shuffle(first),...shuffle(fresh).map(x=>({item:x,dir:'en'}))];
  sess={fresh,learnIdx:0,queue,qIdx:0,wrong:new Set(),requeued:new Set(),correct:0,total:0,extra:!!extra,phase:fresh.length?'learn':'quiz',answered:null,revealed:false};
  render();
}
function optionsFor(q){
  const pool=q.item.unit.items.length>=4?ALL.filter(x=>x.unit===q.item.unit):ALL;
  const others=shuffle(pool.filter(x=>x.id!==q.item.id&&x.en!==q.item.en)).slice(0,3);
  return shuffle([q.item,...others]);
}
function answer(id){
  const q=sess.queue[sess.qIdx];if(sess.answered)return;
  const ok=id===q.item.id;
  sess.answered={choice:id,ok};sess.total++;
  if(ok)sess.correct++;
  else{
    sess.wrong.add(q.item.id);
    const k=q.item.id+q.dir;
    if(!sess.requeued.has(k)){sess.requeued.add(k);sess.queue.push({item:q.item,dir:q.dir})}
  }
  if(ok&&q.dir==='en')speak(q.item.am);
  render();
}
function nextQ(){sess.qIdx++;sess.answered=null;if(sess.qIdx>=sess.queue.length)finish();else render()}
function finish(){
  const t=today();
  if(!sess.extra){
    const ids=new Set(sess.queue.map(q=>q.item.id));
    ids.forEach(id=>{
      const cur=S.items[id]||{box:0};
      const box=sess.wrong.has(id)?1:Math.min(5,(cur.box||0)+1);
      S.items[id]={box,due:addDays(INTERVALS[box])};
    });
    if(S.newDate!==t){S.newDate=t;S.newCount=0}
    S.newCount+=sess.fresh.length;
  }
  S.days[t]=true;
  commit();
  sess.phase='done';render();
}

/* ---------- Views ---------- */
const app=document.getElementById('app');
function header(){const s=streak();return `<header class="top"><div class="top-left"><div class="brand"><span class="am">Krok po kroku</span></div><a class="home-link" href="../" aria-label="Back to all languages"><span aria-hidden="true">&larr;</span>Home</a></div><div class="streak-chip">${s?`<b>${s}</b>-day streak`:'Start your streak today'}</div></header>`}

function greeting(){
  const hr=new Date().getHours();
  if(hr>=18)return{am:'Dobry wieczór',tr:'DOB-ri VYEH-choor',en:'Good evening. One short lesson before the day ends.'};
  if(hr<12)return{am:'Dzień dobry',tr:'jen DOB-ri',en:'Good morning. A little Polish, step by step.'};
  return{am:'Dzień dobry',tr:'jen DOB-ri',en:'Hello. A few minutes this afternoon is enough.'};
}

function viewToday(){
  const g=greeting();
  const fresh=nextNew(),due=dueItems(),doneToday=!!S.days[today()];
  const learned=learnedCount();
  let box;
  if(fresh.length||due.length){
    box=`<section class="lesson" aria-labelledby="lh">
      <h2 id="lh">${doneToday?'There’s a little more for today':'Today’s lesson'}</h2>
      <p>About ${Math.max(3,Math.round((fresh.length*2+due.length)*.25))} minutes.</p>
      <div class="counts"><div><strong>${fresh.length}</strong>new phrases</div><div><strong>${due.length}</strong>to review</div></div>
      <button class="btn primary" data-act="start">${learned?'Start today’s lesson':'Start your first lesson'}</button>
    </section>`;
  }else{
    const all=learned===ALL.length;
    box=`<section class="lesson">
      <h2><span class="am">Brawo!</span> ${all?'You’ve learned every phrase':'You’re done for today'}</h2>
      <p>${all?'Keep reviewing to lock them in. New reviews appear as phrases come due.':'Come back tomorrow for new phrases and reviews. Short and daily beats long and rare.'}</p>
      <div class="actions">${learned?'<button class="btn ghost" data-act="extra">Practice a few more</button>':''}</div>
    </section>`;
  }
  const nxt=ALL.find(x=>!S.items[x.id]);
  const sc=SCENES.find(s=>!S.convos[s.id]);
  const talk=sc?`<section class="talk-card">
      <p class="kick"><span class="am">${sc.am}</span>Try a conversation</p>
      <h2>${esc(sc.title)}</h2>
      <p class="set">${esc(sc.setting)}</p>
      <button class="btn ghost" data-act="convo" data-id="${sc.id}">Start conversation</button>
    </section>`:`<section class="talk-card"><h2>Every conversation done</h2><p class="set">Replay them to make the replies come faster.</p><button class="btn ghost" data-act="go-talk">See conversations</button></section>`;
  return header()+`<section class="hero">
    <p class="glyph" lang="pl">${g.am}</p>
    <p class="gloss"><b>${g.tr}</b>. ${g.en}</p>
  </section>${installTip()}${box}${talk}
  ${nxt?`<p class="upnext">Up next: <span class="am">${nxt.unit.am}</span> ${esc(nxt.unit.title)}</p>`:''}`;
}

function viewSession(){
  const steps=sess.fresh.length+sess.queue.length;
  const pos=(sess.phase==='learn'?sess.learnIdx:sess.fresh.length+sess.qIdx);
  const pct=sess.phase==='done'?100:Math.round(pos/steps*100);
  const top=`<div class="sess-top"><button class="close" data-act="quit" aria-label="Leave lesson">×</button><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>`;

  if(sess.phase==='learn'){
    const x=sess.fresh[sess.learnIdx];
    const last=sess.learnIdx===sess.fresh.length-1;
    const showTr=S.display==='both'||sess.revealed;
    return top+`<div class="stage">
      <p class="kicker">New phrase ${sess.learnIdx+1} of ${sess.fresh.length}: <span class="am">${x.unit.am}</span> ${esc(x.unit.title)}</p>
      <div class="card pop">
        <p class="big" lang="pl">${esc(x.am)}</p>
        ${showTr?`<p class="tr">${esc(x.tr)}</p>`:`<button class="reveal" data-act="reveal">Show pronunciation</button>`}
        <p class="en">${esc(x.en)}</p>
        ${playBtn(x.id)}
        ${x.note?`<p class="note">${x.note}</p>`:''}
      </div>
      <div class="actions"><button class="btn primary" data-act="learn-next">${last?'Start practice':'Next phrase'}</button></div>
    </div>`;
  }

  if(sess.phase==='quiz'){
    const q=sess.queue[sess.qIdx];
    if(!q.opts)q.opts=optionsFor(q);
    const a=sess.answered;
    const prompt=q.dir==='am'
      ?`<p class="prompt-q">What does this mean?</p><p class="big" lang="pl">${esc(q.item.am)}</p>${S.display==='both'?`<p class="tr">${esc(q.item.tr)}</p>`:''}${playBtn(q.item.id)}`
      :`<p class="prompt-q">How do you say this?</p><p class="en" style="margin-top:6px;font-size:24px;font-weight:500">${esc(q.item.en)}</p>`;
    const opts=q.opts.map((o,i)=>{
      let cls='opt';
      if(a){if(o.id===q.item.id)cls+=' right';else if(o.id===a.choice)cls+=' wrong'}
      const label=q.dir==='am'?esc(o.en):`<span><span class="am" lang="pl">${esc(o.am)}</span>${S.display==='both'?`<small>${esc(o.tr)}</small>`:''}</span>`;
      return `<button class="${cls}" data-act="answer" data-id="${o.id}" ${a?'disabled':''}><span class="k">${i+1}</span>${label}</button>`;
    }).join('');
    let fb='';
    if(a){
      fb=a.ok
        ?`<p class="feedback ok" role="status">Correct. <span class="am">${esc(q.item.am)}</span> (${esc(q.item.tr)})</p>`
        :`<p class="feedback no" role="status">Not quite. It’s <span class="am">${esc(q.item.am)}</span> (${esc(q.item.tr)}), “${esc(q.item.en)}.” You’ll see it again.</p>`;
      if(q.item.note)fb+=`<p class="note">${q.item.note}</p>`;
      fb+=`<div class="actions"><button class="btn primary" data-act="next" id="cont">Continue</button></div>`;
    }
    return top+`<div class="stage"><div class="card">${prompt}</div><div class="opts">${opts}</div>${fb}</div>`;
  }

  // done
  return `<div class="done pop">
    <p class="glyph" lang="pl">Brawo!</p>
    <p class="gloss">BRA-vo. Well done.</p>
    <div class="done-stats">
      <div><strong>${sess.correct}/${sess.total}</strong>correct</div>
      <div><strong>${streak()}</strong>day streak</div>
      <div><strong>${learnedCount()}</strong>phrases learned</div>
    </div>
    <button class="btn primary" data-act="home">Back to today</button>
  </div><div class="tibeb" style="margin-top:40px" aria-hidden="true"></div>`;
}

let searchTerm='';
function phraseRows(){
  const t=searchTerm.trim().toLowerCase();
  const out=UNITS.map(u=>{
    const items=u.items.map(([id])=>BY_ID[id]).filter(x=>!t||x.en.toLowerCase().includes(t)||x.tr.toLowerCase().includes(t)||x.am.toLowerCase().includes(t));
    if(!items.length)return'';
    const done=u.items.filter(([id])=>S.items[id]).length;
    return `<section class="unit"><div class="unit-h"><h3><span class="am">${u.am}</span>${esc(u.title)}</h3><span>${done} of ${u.items.length} learned</span></div>
      ${items.map(x=>{const it=S.items[x.id];return `<div class="row"><span class="dot ${it?'s'+it.box:''}" aria-label="${it?(it.box>=4?'Strong':'Learning'):'Not learned yet'}"></span>
        <div><div class="am" lang="pl">${esc(x.am)}</div><div class="tr">${esc(x.tr)}</div><div class="en">${esc(x.en)}</div></div>
        ${playBtn(x.id)}</div>`}).join('')}</section>`;
  }).join('');
  return out||`<p class="empty">No phrases match “${esc(searchTerm)}.” Try an English word like “water” or “thank.”</p>`;
}
function viewPhrases(){
  return header()+`<h1 class="page">Phrasebook</h1>
  <p class="sub">Every phrase in the course. Lessons introduce them in this order.</p>
  <input class="search" id="search" type="search" placeholder="Search in English or Polish" value="${esc(searchTerm)}" aria-label="Search phrases">
  <details class="sounds"><summary>How to read the pronunciation</summary>
    <dl>
      <dt>Stress</dt><dd>Almost always on the second-to-last syllable. The guide shows it in capitals: jen-KOO-yeh.</dd>
      <dt>w</dt><dd>Sounds like English v: <span class="am">woda</span> is VO-da.</dd>
      <dt>ł</dt><dd>Sounds like English w: <span class="am">złoty</span> is ZWO-tih.</dd>
      <dt>sz, cz</dt><dd>Like sh and ch in “shop” and “chip.”</dd>
      <dt>ś, ć, si, ci</dt><dd>Softer sh and ch, made with the tongue pressed higher.</dd>
      <dt>rz, ż</dt><dd>Like the s in “measure.”</dd>
      <dt>ą, ę</dt><dd>Nasal vowels, roughly “on” and “en.” At the end of a word, ę is often just “eh.”</dd>
      <dt>c</dt><dd>Like ts in “cats.”</dd>
      <dt>ch, h</dt><dd>A breathy h, like the ch in Scottish “loch.”</dd>
      <dt>y</dt><dd>As a vowel, like the i in “bit” (shown as ih).</dd>
    </dl>
  </details>
  <div class="legend"><span><i></i>Not learned</span><span><i style="background:var(--gold);border-color:var(--gold)"></i>Learning</span><span><i style="background:var(--green);border-color:var(--green)"></i>Strong</span></div>
  <div id="rows">${phraseRows()}</div>`;
}

let resetArmed=false,resetTimer=null;
function viewProgress(){
  const days=[];const d=new Date();d.setDate(d.getDate()-27);
  // align so the grid starts on Monday
  const offset=(d.getDay()+6)%7;d.setDate(d.getDate()-offset);
  const end=today();
  let cells='';
  for(let i=0;i<35;i++){const s=dstr(d);if(s>end&&i%7===0)break;cells+=`<div class="${S.days[s]?'on':''} ${s===end?'today':''}" title="${s}"></div>`;d.setDate(d.getDate()+1)}
  const ub=UNITS.map(u=>{const n=u.items.filter(([id])=>S.items[id]).length;const p=Math.round(n/u.items.length*100);
    return `<div class="ubar"><div class="lbl"><span style="color:var(--ink)"><span class="am">${u.am}</span> ${esc(u.title)}</span><span>${n}/${u.items.length}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('');
  const seg=(key,opts)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button data-act="set" data-key="${key}" data-val="${v}" aria-pressed="${String(S[key])===String(v)}">${l}</button>`).join('')}</div>`;
  return header()+`<h1 class="page">Progress</h1>
  <div class="stats">
    <div class="stat"><strong>${streak()}</strong><span>day streak</span></div>
    <div class="stat"><strong>${learnedCount()}</strong><span>of ${ALL.length} learned</span></div>
    <div class="stat"><strong>${masteredCount()}</strong><span>strong</span></div>
  </div>
  <h2 class="sec">Last few weeks</h2>
  <div class="cal-days" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
  <div class="cal">${cells}</div>
  <h2 class="sec">By topic</h2>${ub}
  <h2 class="sec">Settings</h2>
  <div class="setting"><label>New phrases each day</label>${seg('newPerDay',[[3,'3'],[5,'5'],[8,'8']])}</div>
  <div class="setting"><label>Use word forms for</label>${addrSeg()}</div>
  <div class="setting"><label>Pronunciation while learning</label>${seg('display',[['both','Always show'],['fidel','Hide until I tap']])}</div>
  <h2 class="sec">Backup</h2>
  <p class="sub" style="margin:0 0 12px">Your progress lives in this browser. Save a backup to move it to another phone or restore it if the browser’s data gets cleared.</p>
  <button class="btn ghost" data-act="export">Download backup file</button>
  <button class="btn ghost" data-act="import">Restore from backup file</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <details class="code"><summary>Use a backup code instead</summary>
    <p class="sub" style="margin:10px 0 0">Copy this code and send it to yourself, or paste a code from another device.</p>
    <textarea id="codeBox" aria-label="Backup code">${encodeBackup()}</textarea>
    <div class="actions"><button class="btn ghost" data-act="copy-code">Copy code</button><button class="btn ghost" data-act="paste-code">Restore from this code</button></div>
  </details>
  ${backupMsg?`<p class="backup-msg ${backupMsg.err?'err':''}" role="status">${esc(backupMsg.text)}</p>`:''}
  <h2 class="sec">Start over</h2>
  <button class="danger ${resetArmed?'armed':''}" data-act="reset">${resetArmed?'Tap again to erase all progress':'Reset progress'}</button>
  <p class="sync">${synced?'Your progress is saved to your account, so it follows you across devices.':'Your progress is saved in this browser.'}</p>`;
}

/* ---------- Install & storage ---------- */
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(!sess&&!convo&&view==='today')render()});
window.addEventListener('appinstalled',()=>{installEvt=null;if(!sess&&!convo)render()});
function tipDismissed(){try{return localStorage.getItem('krok-tip')==='1'}catch(e){return false}}
function installTip(){
  if(isStandalone()||tipDismissed())return'';
  if(installEvt)return `<div class="tip"><p>Install Krok po kroku on your phone so it opens like an app and works offline.</p></div><div class="actions"><button class="btn ghost" data-act="install">Install app</button></div>`;
  if(isIOS)return `<div class="tip"><p>Add this app to your home screen: tap the Share button, then <b>Add to Home Screen</b>. It works offline and keeps your progress safe.</p><button class="x" data-act="tip-x" aria-label="Dismiss">×</button></div>`;
  return'';
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>{if(!p)navigator.storage.persist()})}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

let backupMsg=null;
function encodeBackup(){return btoa(unescape(encodeURIComponent(JSON.stringify({app:'krok-po-kroku',v:1,data:S}))))}
function restoreFrom(text){
  let obj;
  try{obj=JSON.parse(text)}catch(e){try{obj=JSON.parse(decodeURIComponent(escape(atob(text.trim()))))}catch(e2){obj=null}}
  const d=obj&&obj.app==='krok-po-kroku'?obj.data:null;
  if(!d||typeof d.items!=='object'||typeof d.days!=='object'){backupMsg={err:true,text:'That isn’t a Krok po kroku backup. Check that you copied the whole code or picked the right file.'};render();return}
  if(!confirm('Replace your current progress with this backup?'))return;
  S=Object.assign(blank(),d);commit();
  backupMsg={err:false,text:'Progress restored: '+Object.keys(S.items).length+' phrases learned.'};render();
}

/* ---------- Conversation play ---------- */
let convo=null;
function g(x){return(x&&typeof x==='object')?x[S.addressAs||'f']:x}
function smooth(){return matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}
function startConvo(id){
  const sc=SCENES.find(s=>s.id===id);if(!sc)return;
  if(!S.addressAs){view='talk';render();window.scrollTo(0,0);return}
  convo={sc,turn:0,answered:null,score:0,log:[],order:null,showEn:false,done:false};
  prepTurn();render();window.scrollTo(0,0);
}
function prepTurn(){const t=convo.sc.turns[convo.turn];convo.order=shuffle(t.opts.map((_,i)=>i));convo.answered=null;convo.showEn=false}
function scrollTurn(){const el=document.getElementById('turn');if(el)el.scrollIntoView({block:'start',behavior:smooth()})}
function convoAnswer(i){
  if(!convo||convo.answered)return;
  const t=convo.sc.turns[convo.turn],ok=!!t.opts[i].ok;
  convo.answered={i,ok};if(ok)convo.score++;
  const c=t.opts.find(o=>o.ok);if(ok&&c.am)speak(g(c.am));
  render();const f=document.getElementById('cont');if(f)f.scrollIntoView({block:'nearest',behavior:smooth()});
}
function convoNext(){
  const t=convo.sc.turns[convo.turn],c=t.opts.find(o=>o.ok);
  if(t.narr)convo.log.push({k:'narr',text:t.narr});
  if(t.npc)convo.log.push({k:'them',who:t.who||convo.sc.who,am:g(t.npc.am),tr:g(t.npc.tr),en:t.npc.en});
  if(t.type==='check')convo.log.push({k:'narr',text:'You understood: '+c.en+'.'});
  else convo.log.push({k:'me',am:g(c.am),tr:g(c.tr),en:c.en});
  convo.turn++;
  if(convo.turn>=convo.sc.turns.length){
    const id=convo.sc.id,prev=S.convos[id];
    S.convos[id]={best:Math.max(prev?prev.best:0,convo.score)};
    S.days[today()]=true;commit();
    convo.done=true;render();window.scrollTo(0,0);
  }else{prepTurn();render();scrollTurn()}
}
function bubble(b,live){
  if(b.k==='narr')return `<p class="narr">${esc(b.text)}</p>`;
  if(b.k==='me')return `<div class="bub me"><span class="am" lang="pl">${esc(b.am)}</span><div class="tr">${esc(b.tr)}</div><div class="en">${esc(b.en)}</div></div>`;
  const show=!live||convo.showEn||convo.answered;
  return `<div class="bub them"><div class="who">${esc(b.who)}</div><span class="am" lang="pl">${esc(b.am)}</span>${S.display==='both'||show?`<div class="tr">${esc(b.tr)}</div>`:''}${show?`<div class="en">${esc(b.en)}</div>`:''}<div class="tools">${show?'':`<button class="mini" data-act="show-en">Show English</button>`}${voice?`<button class="mini" data-act="say" data-text="${esc(b.am)}">▶ Listen</button>`:''}</div></div>`;
}
function viewConvo(){
  const sc=convo.sc,n=sc.turns.length;
  if(convo.done){
    const used=sc.turns.filter(t=>t.type!=='check').map(t=>t.opts.find(o=>o.ok));
    return `<div class="done pop">
      <p class="glyph" lang="pl">Brawo!</p>
      <p class="gloss">BRA-vo. You finished “${esc(sc.title)}.”</p>
      <div class="done-stats"><div><strong>${convo.score}/${n}</strong>best replies</div><div><strong>${streak()}</strong>day streak</div></div>
    </div>
    <h2 class="sec">Replies from this conversation</h2>
    ${used.map(o=>`<div class="row" style="grid-template-columns:1fr auto"><div><div class="am" lang="pl">${esc(g(o.am))}</div><div class="tr">${esc(g(o.tr))}</div><div class="en">${esc(o.en)}</div></div>${voice?`<button class="play" data-act="say" data-text="${esc(g(o.am))}">▶ Listen</button>`:''}</div>`).join('')}
    <div class="actions"><button class="btn primary" data-act="convo-again">Try it again</button><button class="btn ghost" data-act="convo-exit">Back to conversations</button></div>`;
  }
  const t=sc.turns[convo.turn],a=convo.answered;
  const pct=Math.round(convo.turn/n*100);
  const top=`<div class="sess-top"><button class="close" data-act="quit" aria-label="Leave conversation">×</button><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>`;
  const intro=`<div class="scene-intro"><span class="am">${sc.am}</span><b>${esc(sc.title)}</b><br>${esc(sc.setting)}</div>`;
  let cur='';
  if(t.narr)cur+=`<p class="narr">${esc(t.narr)}</p>`;
  if(t.npc)cur+=bubble({k:'them',who:t.who||sc.who,am:g(t.npc.am),tr:g(t.npc.tr),en:t.npc.en},true);
  const ask=t.type==='check'?t.q:(t.npc?'Your reply':'Your turn to speak');
  const opts=convo.order.map((oi,k)=>{
    const o=t.opts[oi];let cls='opt';
    if(a){if(o.ok)cls+=' right';else if(oi===a.i)cls+=' wrong'}
    const label=t.type==='check'?esc(o.en):`<span><span class="am" lang="pl">${esc(g(o.am))}</span>${S.display==='both'||a?`<small>${esc(g(o.tr))}</small>`:''}${a?`<small>${esc(o.en)}</small>`:''}</span>`;
    return `<button class="${cls}" data-act="reply" data-i="${oi}" ${a?'disabled':''}><span class="k">${k+1}</span>${label}</button>`;
  }).join('');
  let fb='';
  if(a){
    const c=t.opts.find(o=>o.ok),ch=t.opts[a.i];
    if(a.ok)fb=`<p class="feedback ok" role="status">Good reply.</p><p class="note">${c.why}</p>`;
    else fb=`<p class="feedback no" role="status">Not the best reply.</p><p class="note">${ch.why}</p><p class="note">${t.type==='check'?`Answer: ${esc(c.en)}. `:`Best reply: <span class="am">${esc(g(c.am))}</span> (${esc(g(c.tr))}), “${esc(c.en)}.” `}${c.why}</p>`;
    fb+=`<div class="actions"><button class="btn primary" data-act="convo-next" id="cont">${convo.turn===n-1?'Finish':'Continue'}</button></div>`;
  }
  return top+`<div class="chat">${intro}${convo.log.map(b=>bubble(b,false)).join('')}<div id="turn" style="display:flex;flex-direction:column;gap:12px">${cur}</div></div>
    <p class="your-turn">${esc(ask)}</p><div class="opts" style="margin-top:10px">${opts}</div>${fb}`;
}
function addrSeg(){return `<div class="seg" role="group" aria-label="Which forms to use for you">${[['f','A woman'],['m','A man']].map(([v,l])=>`<button data-act="set" data-key="addressAs" data-val="${v}" aria-pressed="${S.addressAs===v}">${l}</button>`).join('')}</div>`}
function viewTalk(){
  return header()+`<h1 class="page">Conversations</h1>
  <p class="sub">Everyday situations you’re likely to meet in Poland. Read what people say, then pick the best reply.</p>
  ${S.addressAs?'':`<div class="addr"><p>Polish changes some words for men and women: how people address you (<span class="am">pan</span> or <span class="am">pani</span>) and how you describe yourself (<span class="am">zmęczony</span> or <span class="am">zmęczona</span>). Which forms should the app use for you?</p>${addrSeg()}</div>`}
  ${SCENES.map(s=>{const r=S.convos[s.id];return `<button class="scene" data-act="convo" data-id="${s.id}" ${S.addressAs?'':'disabled'}>
    <div class="place"><span class="am">${s.am}</span>${esc(s.place)}</div><h3>${esc(s.title)}</h3><p>${esc(s.setting)}</p>
    <div class="meta"><span>${s.turns.length} replies</span>${r?`<b>Best so far: ${r.best} of ${s.turns.length}</b>`:''}</div></button>`}).join('')}`;
}

function render(){
  const busy=!!(sess||convo);
  document.body.classList.toggle('in-session',busy);
  document.getElementById('tabs').hidden=busy;
  if(sess)app.innerHTML=viewSession();
  else if(convo)app.innerHTML=viewConvo();
  else app.innerHTML=view==='phrases'?viewPhrases():view==='progress'?viewProgress():view==='talk'?viewTalk():viewToday();
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===view?'page':'false'));
  const c=document.getElementById('cont');if(c)c.focus({preventScroll:true});
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){view=tab.dataset.tab;backupMsg=null;try{history.replaceState(null,'','#'+view)}catch(_){}resetArmed=false;render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  if(act==='start')startSession(false);
  else if(act==='extra')startSession(true);
  else if(act==='speak')speak(BY_ID[b.dataset.id].am);
  else if(act==='reveal'){sess.revealed=true;render()}
  else if(act==='learn-next'){sess.revealed=false;if(sess.learnIdx<sess.fresh.length-1)sess.learnIdx++;else sess.phase='quiz';render();window.scrollTo(0,0)}
  else if(act==='answer')answer(b.dataset.id);
  else if(act==='next'){nextQ();window.scrollTo(0,0)}
  else if(act==='quit'||act==='home'){if(convo){convo=null;view='talk'}else{sess=null;view='today'}render();window.scrollTo(0,0)}
  else if(act==='convo')startConvo(b.dataset.id);
  else if(act==='install'){if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}}
  else if(act==='tip-x'){try{localStorage.setItem('krok-tip','1')}catch(_){}render()}
  else if(act==='export'){
    const blob=new Blob([JSON.stringify({app:'krok-po-kroku',v:1,data:S},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='krok-po-kroku-backup-'+today()+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
    backupMsg={err:false,text:'Backup downloaded. Keep the file somewhere safe, like your cloud drive.'};render();
  }
  else if(act==='import')document.getElementById('importFile').click();
  else if(act==='copy-code'){const t=document.getElementById('codeBox').value;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{backupMsg={err:false,text:'Code copied.'};render()})
      .catch(()=>{const box=document.getElementById('codeBox');box.select();backupMsg={err:false,text:'Code selected. Copy it with your keyboard or long-press.'};render()})}
  else if(act==='paste-code')restoreFrom(document.getElementById('codeBox').value);
  else if(act==='go-talk'){view='talk';render();window.scrollTo(0,0)}
  else if(act==='show-en'){convo.showEn=true;render()}
  else if(act==='say')speak(b.dataset.text);
  else if(act==='reply')convoAnswer(Number(b.dataset.i));
  else if(act==='convo-next')convoNext();
  else if(act==='convo-again')startConvo(convo.sc.id);
  else if(act==='convo-exit'){convo=null;view='talk';render();window.scrollTo(0,0)}
  else if(act==='set'){const k=b.dataset.key;S[k]=k==='newPerDay'?Number(b.dataset.val):b.dataset.val;commit();render()}
  else if(act==='reset'){
    if(!resetArmed){resetArmed=true;clearTimeout(resetTimer);resetTimer=setTimeout(()=>{resetArmed=false;if(view==='progress'&&!sess)render()},4000);render()}
    else{resetArmed=false;const keep={newPerDay:S.newPerDay,display:S.display};S=Object.assign(blank(),keep);commit();render()}
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='importFile'&&e.target.files&&e.target.files[0]){const r=new FileReader();r.onload=()=>restoreFrom(String(r.result));r.readAsText(e.target.files[0])}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){searchTerm=e.target.value;document.getElementById('rows').innerHTML=phraseRows()}});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(convo&&!convo.done){
    if(!convo.answered&&/^[1-4]$/.test(e.key)){const oi=convo.order[Number(e.key)-1];if(oi!==undefined)convoAnswer(oi)}
    else if(convo.answered&&e.key==='Enter'){e.preventDefault();convoNext()}
    return;
  }
  if(!sess)return;
  if(sess.phase==='quiz'){
    const q=sess.queue[sess.qIdx];
    if(!sess.answered&&/^[1-4]$/.test(e.key)&&q.opts){const o=q.opts[Number(e.key)-1];if(o)answer(o.id)}
    else if(sess.answered&&e.key==='Enter'){e.preventDefault();nextQ()}
  }else if(sess.phase==='learn'&&(e.key==='Enter'||e.key==='ArrowRight')){
    const btn=document.querySelector('[data-act="learn-next"]');if(btn&&document.activeElement!==btn){e.preventDefault();btn.click()}
  }
});

render();
connect();
</script>
</body>
</html>
